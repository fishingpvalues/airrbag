<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Airrbag</title>
<style>
:root{--bg:#202020;--panel:#2a2a2a;--line:#3a3a3a;--fg:#e1e2e3;--dim:#909293;--keep:#f05050;--frees:#a46bd6;--safe:#27c24c;--unknown:#909293;--usenet:#5d9cec;--torrent:#ff902b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:18px;margin:0}h1 span{color:var(--dim);font-weight:400;font-size:13px;margin-left:8px}
main{padding:20px;max-width:1400px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:4px;padding:12px 14px;cursor:pointer}
.card.on{outline:1px solid var(--c)}.card b{display:block;font-size:22px}.card small{color:var(--dim)}
.card p{margin:4px 0 0;color:var(--dim);font-size:12px}
input{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:7px 10px;border-radius:4px;min-width:260px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
td.path{word-break:break-all;color:var(--dim);font-size:12px}td.num{text-align:right;white-space:nowrap}
.b{display:inline-block;padding:1px 7px;border-radius:3px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap}
.v-keep{background:var(--keep)}.v-frees-nothing{background:var(--frees)}.v-safe{background:var(--safe)}.v-unknown{background:var(--unknown)}
.p-usenet{background:var(--usenet)}.p-torrent{background:var(--torrent)}.p-private{background:var(--keep)}.p-unknown{background:var(--unknown)}
.why{color:var(--dim);font-size:12px}.err{color:var(--keep);margin:12px 0}
#state{color:var(--dim)}
</style>
</head>
<body>
<header><h1>Airrbag<span id="app"></span></h1><input id="q" placeholder="Filter by title or path" autocomplete="off"><span id="state">Evaluating the library...</span></header>
<main>
<div class="cards" id="cards"></div>
<div id="errors"></div>
<table><thead><tr><th>Verdict</th><th>Source</th><th>Title</th><th>File</th><th>Size</th><th>Why</th></tr></thead><tbody id="rows"></tbody></table>
</main>
<script>
(function(){
  var KINDS=[
    ["safe","Safe to delete","frees space, no seed is owed","--safe"],
    ["frees-nothing","Frees nothing","hardlink of a running seed","--frees"],
    ["keep","Keep","private seed still owed","--keep"],
    ["unknown","Unknown","no history or client unreachable","--unknown"]];
  var data=null, filter=null;
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  function size(n){var u=["B","KB","MB","GB","TB"],i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]}
  function source(f){var s=el("span","b p-"+(f.protocol==="torrent"&&f.private?"private":f.protocol),
    f.protocol==="torrent"?(f.private?"Torrent (private)":"Torrent"):f.protocol==="usenet"?"Usenet":"Unknown");
    s.title=[f.indexer,f.client,f.tracker].filter(Boolean).join(" | ");return s}
  function render(){
    var q=document.getElementById("q").value.toLowerCase(), rows=document.getElementById("rows"), cards=document.getElementById("cards");
    cards.textContent="";
    KINDS.forEach(function(k){var c=el("div","card"+(filter===k[0]?" on":""));c.style.setProperty("--c","var("+k[3]+")");
      c.appendChild(el("small",null,k[1]));c.appendChild(el("b",null,String((data.counts||{})[k[0]]||0)));
      c.appendChild(el("p",null,size((data.bytes||{})[k[0]]||0)+" - "+k[2]));
      c.onclick=function(){filter=filter===k[0]?null:k[0];render()};cards.appendChild(c)});
    rows.textContent="";var shown=0;
    (data.files||[]).forEach(function(f){
      if(filter&&f.verdict!==filter)return;
      if(q&&(f.parentTitle||"").toLowerCase().indexOf(q)<0&&f.path.toLowerCase().indexOf(q)<0)return;
      if(++shown>2000)return;
      var tr=el("tr");var v=el("td");v.appendChild(el("span","b v-"+f.verdict,f.verdict));tr.appendChild(v);
      var s=el("td");s.appendChild(source(f));tr.appendChild(s);
      tr.appendChild(el("td",null,f.parentTitle||""));tr.appendChild(el("td","path",f.path));
      tr.appendChild(el("td","num",size(f.size||0)));tr.appendChild(el("td","why",(f.reasons||[]).join("; ")));
      rows.appendChild(tr)});
    document.getElementById("state").textContent=shown+" files shown, computed "+new Date(data.computedAt).toLocaleString();
  }
  document.getElementById("q").oninput=render;
  fetch("api/info",{credentials:"same-origin"}).then(function(r){return r.json()}).then(function(i){
    document.getElementById("app").textContent=i.app+(i.dryRun?" - guard dry-run":i.guard?" - guard on":" - guard off")}).catch(function(){});
  fetch("api/lists",{credentials:"same-origin"}).then(function(r){
    if(r.status===401)throw new Error("Sign in to the *Arr in this browser first, then reload.");
    return r.json()}).then(function(d){if(d.error)throw new Error(d.error);data=d;
      (d.errors||[]).slice(0,5).forEach(function(e){document.getElementById("errors").appendChild(el("div","err",e))});render()})
    .catch(function(e){document.getElementById("state").textContent="";document.getElementById("errors").appendChild(el("div","err",e.message))});
})();
</script>
</body>
</html>
