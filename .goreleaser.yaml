version: 2
project_name: airrbag

before:
  hooks:
    - sh -c 'cd web && npm ci --no-audit --no-fund && npm run build'

builds:
  - id: airrbag
    main: ./cmd/airrbag
    binary: airrbag
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - examples/airrbag.yml

checksum:
  name_template: checksums.txt

# release-please writes the changelog and creates the release; goreleaser
# only attaches the binaries to it.
release:
  mode: keep-existing
changelog:
  disable: true
