name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly: the integration matrix pins *Arr images, and Renovate bumps
    # them; this catches drift in what the pinned builds themselves do.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: airrbag-js
          path: |
            internal/webassets/dist/airrbag.js
            internal/webassets/dist/dashboard.js
            internal/webassets/dist/dashboard.css
          if-no-files-found: error

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  build:
    name: build
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airrbag-js
          path: internal/webassets/dist
      - run: go build -trimpath -o airrbag ./cmd/airrbag && ./airrbag version
      - run: chmod 600 examples/airrbag.yml && ./airrbag check-config -config examples/airrbag.yml
        env:
          RADARR_API_KEY: x
          SONARR_API_KEY: x
          QBITTORRENT_PASSWORD: x
          SABNZBD_API_KEY: x

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build multi-arch (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # One job per supported app, each against a pinned real image. The job
  # name is fixed per app (not the image), so branch protection can rely on
  # the aggregate ci-ok below instead of names that change with every bump.
  integration:
    name: integration-${{ matrix.app }}
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: radarr
            image: lscr.io/linuxserver/radarr:6.4.4.10685-ls318
            port: 7878
          - app: sonarr
            image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls326
            port: 8989
          - app: lidarr
            image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls42
            port: 8686
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: airrbag-js
          path: internal/webassets/dist
      - run: scripts/integration.sh "${{ matrix.app }}" "${{ matrix.image }}" "${{ matrix.port }}"

  # qBittorrent releases with different WebAPI shapes: 4.3 (no private flag,
  # no seeding_time in the list), 4.6 (is_private in properties) and 5.x
  # (private in the list, 204 login). Each run also reads the release's real
  # BT_backup with the libtorrent resume reader.
  integration-qbittorrent:
    name: integration-qbittorrent-${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "4.3"
            image: lscr.io/linuxserver/qbittorrent:14.3.9.99202110311443-7435-01519b5e7ubuntu20.04.1-ls166
          - release: "4.6"
            image: lscr.io/linuxserver/qbittorrent:4.6.7-r0-ls353
          - release: "5"
            image: lscr.io/linuxserver/qbittorrent:5.2.4_v2.0.15-ls479
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: scripts/integration-qbittorrent.sh "${{ matrix.image }}"

  # Known vulnerabilities in the Go module graph that the code actually calls.
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          go-version-file: go.mod
          go-package: ./...

  # Secrets in the full git history. Test fixtures with fake credentials are
  # allow-listed in .gitleaks.toml, nothing else.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan history
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --config .gitleaks.toml --verbose .

  # The release image as shipped: OS packages and Go binary, HIGH/CRITICAL
  # with a fix available fail the build.
  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: airrbag:ci
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: airrbag:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: Image runs as non-root
        run: |
          user=$(docker inspect airrbag:ci --format '{{.Config.User}}')
          echo "image user: $user"
          case "$user" in ""|root|0|0:0) echo "image must not run as root"; exit 1;; esac

  # The single required status check. Matrix job names change; this does not.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [web, lint, test, build, docker, integration, integration-qbittorrent, govulncheck, gitleaks, trivy]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success")'
