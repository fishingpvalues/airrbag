# gitleaks configuration: the default rules, plus an allow-list for the fake
# credentials that tests and examples need. Nothing real belongs here.
[extend]
useDefault = true

[allowlist]
description = "Fake credentials in tests, fixtures and examples"
paths = [
  '''(^|/)testdata/''',
  '''_test\.go$''',
  '''(^|/)examples/''',
]
regexes = [
  '''0123456789abcdef0123456789abcdef''',
]
