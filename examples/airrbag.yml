# Airrbag example configuration.
# Every ${NAME} is read from the environment, so secrets stay out of this file.

# One entry per *Arr. Each gets its own listener: point your browser (and any
# tool that deletes through the *Arr API) at the listener instead of the *Arr.
instances:
  - name: radarr
    listen: ":17878"
    upstream: http://radarr:7878
    api_key: ${RADARR_API_KEY}
    # app: auto          # sonarr | radarr | lidarr | readarr | whisparr | auto
  - name: sonarr
    listen: ":18989"
    upstream: http://sonarr:8989
    api_key: ${SONARR_API_KEY}

# Download-client credentials. Airrbag finds each client's address in the
# *Arr's own settings, but the *Arr API masks passwords, so they go here.
# `name` must equal the client's name in the *Arr (Settings > Download Clients).
clients:
  - name: qBittorrent
    type: qbittorrent
    username: admin
    password: ${QBITTORRENT_PASSWORD}
    # url: http://qbittorrent:8080   # optional: overrides the discovered address
  - name: SABnzbd
    type: sabnzbd
    api_key: ${SABNZBD_API_KEY}
  # Other torrent clients the *Arr knows are discovered the same way:
  # - { name: Transmission, type: transmission, username: u, password: ${TRANSMISSION_PASSWORD} }
  # - { name: Deluge, type: deluge, password: ${DELUGE_PASSWORD} }       # Web UI password
  # - { name: rTorrent, type: rtorrent, username: u, password: ${RTORRENT_PASSWORD} }
  # Provenance sources the *Arr does not list:
  # - { name: NZBHydra2, type: nzbhydra2, url: http://nzbhydra2:5076 }  # api_key optional
  # - { name: Xunlei, type: xunlei, path: /media/downloads/xunlei }       # its download folder

# Airrbag compares inodes, so it must see the same files the *Arr and the
# torrent client see. Mount the media read-only into the Airrbag container
# and translate each app's path prefix to Airrbag's.
path_mappings:
  - { from: /movies, to: /media/movies, source: arr }       # as the *Arr sees it
  - { from: /tv, to: /media/tv, source: arr }
  - { from: /downloads, to: /media/downloads, source: client }  # as qBittorrent sees it

trackers:
  # Optional roster of private trackers (domains, announce domains, name
  # fragments). The torrent's own private flag is always honored as well.
  # file: /config/private-trackers.json
  private:
    - example-tracker.org
  # Seeding obligations. Met when either threshold is reached, unless
  # require_both is set. A private torrent with no matching rule and no
  # default is never considered done: the safe assumption.
  rules:
    - domains: [example-tracker.org]
      min_seed_time: 72h
      min_ratio: 1.0
  default:
    min_seed_time: 14d

guard:
  # enabled: true      # refuse deletes of "keep" files with 409 (default on)
  # dry_run: false     # log what would be blocked instead of blocking
  # fail_closed: true  # a check that cannot run answers 503 instead of passing
  # unknown: confirm   # no provenance evidence: confirm (ask once) | block | allow
  #                    # torrent evidence without a visible seed is always kept
  # grant_ttl: 2m      # how long a confirmation in the browser dialog lasts

# cache_ttl: 5m
# history_limit: 100000
# log_level: info
